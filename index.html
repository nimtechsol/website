<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimble Technology Solutions</title>
<meta name="description" content="IT services for the Dallas–Fort Worth metroplex.">
<style>
  :root {
    --bg: #fbfbfa;
    --fg: #1a1a18;
    --muted: #6b6b66;
    --rule: #e2e2dd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --fg: #ececea; --muted: #8e8e88; --rule: #2a2a30; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-content: center;
    gap: 1.5rem;
    padding: 2rem;
    background: var(--bg);
    color: var(--fg);
    font: 400 1rem/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 5vw, 2.25rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  p { margin: 0; color: var(--muted); }
  hr { width: 3rem; margin: 0 auto; border: 0; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
  <h1>Nimble Technology Solutions</h1>
  <hr>
  <p>IT services for the Dallas&ndash;Fort Worth metroplex.</p>
  <p>Site coming soon.</p>
</body>
</html>
